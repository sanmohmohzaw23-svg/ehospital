const API="https://aetab8pjmb.us-east-1.awsapprunner.com",TAG="voice-consult-",APPT_TAG="appt-";
let apiOn=false,doctors=[],docId="",tableSchemas={},st={sub:"Submitted",app:"Approved",rej:"Rejected"},me0=null;

function loadSession(){
  try{return JSON.parse(localStorage.getItem("ehospital_me")||window.name||"null");}catch(_){
    try{return JSON.parse(window.name||"null");}catch(__){return null;}
  }
}
function saveSession(val){
  me0=val;
  if(val){form.name=val.fullName||form.name;form.phone=val.phone||form.phone;form.age=val.dob||form.age;}
  const raw=JSON.stringify(val);
  try{window.name=raw;}catch(_){}
  try{if(val)localStorage.setItem("ehospital_me",raw);else localStorage.removeItem("ehospital_me");}catch(_){}
}

const me=()=>apiOn?(me0&&me0.pid):"local";
const today=()=>new Date().toISOString().slice(0,10),nowIso=()=>new Date().toISOString().slice(0,19).replace("T"," ");
const ageOf=d=>{const x=Date.parse(d);return x?Math.floor((Date.now()-x)/31557600000):"";};
const clean=o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v!==""&&v!=null));
const cst=s=>/approv/i.test(s)?"approved":/reject|den|declin/i.test(s)?"rejected":"submitted";

function fitColumns(tableName,payload){
  const attrs=tableSchemas[tableName];
  const cleaned=clean(payload);
  if(!attrs||!attrs.length)return cleaned;
  return Object.fromEntries(Object.entries(cleaned).filter(([k])=>attrs.includes(k)));
}

async function api(path,method,body){
  const r=await fetch(API+path,{method:method||"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json();}catch(_){}
  if(!r.ok)throw new Error(j.error||j.message||("HTTP "+r.status));
  return j;
}
const sel=async(sql,rep)=>(await api("/sql/select","POST",{sql,replacements:rep||{}})).data||[];

async function connectApi(){
  try{
    const c=new AbortController();setTimeout(()=>c.abort(),7000);
    const meta=await api("/tables");
    apiOn=true;
    (meta.tables||[]).forEach(tb=>{tableSchemas[tb.name]=tb.attributes||[];});
    try{
      const v=(await sel("SELECT DISTINCT claim_status FROM insurance_claims LIMIT 20")).map(x=>String(x.claim_status||""));
      st.app=v.find(x=>/approv/i.test(x))||st.app;
      st.rej=v.find(x=>/reject|den|declin/i.test(x))||st.rej;
      st.sub=v.find(x=>/pend|submit|review/i.test(x))||st.sub;
    }catch(_){}
  }catch(_){apiOn=false;}
  await refresh();view();
}

async function lookupPatient(query){
  const q=String(query||"").trim();
  if(!q){toast(t().need);return null;}

  // Offline / Demo mode lookup by phone, full name, or ID
  if(!apiOn){
    const ql=q.toLowerCase();
    const match=cases.find(c=>
      String(c.pid)===q||
      String(c.id)===q||
      (c.phone&&String(c.phone).toLowerCase().includes(ql))||
      (c.name&&String(c.name).toLowerCase()===ql)
    );
    if(!match)return null;
    form.allergy=match.allergy||"";
    saveSession({
      pid:match.pid||"local",
      name:String(match.name||"").toLowerCase(),
      fullName:match.name,
      phone:match.phone||"",
      dob:match.dob||""
    });
    return {patient_id:match.pid||"local",name:match.name};
  }

  // Live MySQL API lookup
  const isId=/^\d+$/.test(q);
  const rows=isId
    ?await sel("SELECT patient_id,name,dob,phone_number FROM patients_registration WHERE patient_id=:id LIMIT 1",{id:Number(q)})
    :await sel("SELECT patient_id,name,dob,phone_number FROM patients_registration WHERE phone_number LIKE :ph OR LOWER(name)=:nm LIMIT 1",{ph:"%"+q+"%",nm:q.toLowerCase()});
  if(!rows.length)return null;
  const p=rows[0];
  let allergy="";
  try{
    const al=await sel("SELECT GROUP_CONCAT(allergen SEPARATOR ', ') AS a FROM allergy_records WHERE patient_id=:pid",{pid:p.patient_id});
    allergy=(al[0]&&al[0].a)||"";
  }catch(_){}
  form.allergy=allergy;
  saveSession({pid:p.patient_id,name:String(p.name||"").toLowerCase(),fullName:p.name,phone:p.phone_number||"",dob:p.dob||""});
  await refresh();
  return p;
}

async function refresh(){
  if(!apiOn)return;
  try{
    if(!doctors.length&&tableSchemas.doctors_registration){
      doctors=await sel("SELECT doctor_id,name FROM doctors_registration ORDER BY doctor_id LIMIT 50");
      if(doctors.length&&!docId)docId=String(doctors[0].doctor_id);
      if(doctors.length&&!bookForm.docId)bookForm.docId=String(doctors[0].doctor_id);
    }

    if(role==="c"){
      const pc=await sel("SELECT COUNT(*) AS c FROM patients_registration");
      stats.patients=(pc[0]&&pc[0].c)||0;
      stats.doctors=doctors.length;
    }

    const mine=role==="p";
    if(mine&&!(me0&&me0.pid)){cases=[];appointments=[];return;}
    const rep=mine?{pid:me0.pid}:{};

    const rows=await sel(
      "SELECT h.record_id,h.patient_id,h.symptoms,h.queue_name,h.check_in_time,h.completed_at,h.clinical_summary,h.recommended_action,p.name,p.dob,p.phone_number,"+
      "(SELECT GROUP_CONCAT(a.allergen SEPARATOR ', ') FROM allergy_records a WHERE a.patient_id=h.patient_id) AS allergy "+
      "FROM healthcare_records h JOIN patients_registration p ON p.patient_id=h.patient_id "+
      "WHERE h.queue_name LIKE 'voice-consult-%'"+(mine?" AND h.patient_id=:pid":"")+" ORDER BY h.record_id DESC LIMIT 60",rep
    );
    const cl=await sel(
      "SELECT claim_id,reference_number,claim_amount,claim_status,notes FROM insurance_claims "+
      "WHERE notes LIKE 'voice-consult-%'"+(mine?" AND patient_id=:pid":"")+" ORDER BY claim_id DESC LIMIT 100",rep
    );
    const cm={};
    cl.forEach(c=>{const k=String(c.notes||"").slice(TAG.length);if(!cm[k])cm[k]={id:c.claim_id,ins:c.reference_number,amt:c.claim_amount,status:cst(c.claim_status)};});
    cases=rows.map(r=>({
      id:String(r.record_id),pid:r.patient_id,name:r.name,dob:r.dob,phone:r.phone_number,allergy:r.allergy||"",
      symptoms:r.symptoms,lang:String(r.queue_name).split("-")[2]||"en",ts:Date.parse(r.check_in_time)||Date.now(),
      status:r.completed_at?"prescribed":"waiting",dx:r.clinical_summary||"",rx:r.recommended_action||"",claim:cm[String(r.record_id)]||null
    }));

    if(tableSchemas.appointments){
      const aCols=tableSchemas.appointments;
      const dtCol=aCols.includes("appointment_date")?"appointment_date":aCols.includes("scheduled_at")?"scheduled_at":"created_at";
      const rsCol=aCols.includes("reason")?"reason":aCols.includes("notes")?"notes":"status";
      appointments=await sel(
        `SELECT a.*, p.name AS patient_name, d.name AS doctor_name FROM appointments a `+
        `LEFT JOIN patients_registration p ON p.patient_id=a.patient_id `+
        `LEFT JOIN doctors_registration d ON d.doctor_id=a.doctor_id `+
        (mine?"WHERE a.patient_id=:pid ":"")+`ORDER BY 1 DESC LIMIT 40`,rep
      );
      appointments=appointments.map(a=>({
        id:a.appointment_id||a.id,patient:a.patient_name||("#"+a.patient_id),doctor:a.doctor_name||("#"+(a.doctor_id||"")),
        when:(a[dtCol]||"")+" "+(a.appointment_time||""),reason:a[rsCol]||"",status:a.status||"Scheduled"
      }));
    }else{
      const ar=await sel(
        "SELECT h.record_id,h.symptoms,h.queue_name,h.check_in_time,p.name FROM healthcare_records h "+
        "JOIN patients_registration p ON p.patient_id=h.patient_id WHERE h.queue_name LIKE 'appt-%'"+
        (mine?" AND h.patient_id=:pid":"")+" ORDER BY h.record_id DESC LIMIT 40",rep
      );
      appointments=ar.map(a=>({id:a.record_id,patient:a.name,doctor:String(a.queue_name).slice(APPT_TAG.length),when:a.check_in_time,reason:a.symptoms,status:"Scheduled"}));
    }

    if(tableSchemas.patient_feedback){
      feedbacks=await sel("SELECT * FROM patient_feedback ORDER BY 1 DESC LIMIT 30");
    }
  }catch(e){toast("DB: "+e.message);}
}

async function ensurePatient(r){
  let pid=me0&&me0.name===r.name.toLowerCase()?me0.pid:null;
  if(!pid){
    const existing=await sel("SELECT patient_id,name,dob,phone_number FROM patients_registration WHERE LOWER(name)=:name LIMIT 1",{name:r.name.toLowerCase()});
    if(existing.length){
      pid=existing[0].patient_id;
    }else{
      const j=await api("/table/patients_registration","POST",fitColumns("patients_registration",{
        name:r.name,dob:r.dob,phone_number:r.phone,contact_info:r.phone
      }));
      pid=j.data.patient_id;
    }
    saveSession({pid,name:r.name.toLowerCase(),fullName:r.name,phone:r.phone,dob:r.dob});
  }
  return pid;
}

async function addCase(r){
  if(!apiOn){
    r.id="l"+Date.now();
    cases.unshift(r);
    persist();
    saveSession({pid:"local",name:r.name.toLowerCase(),fullName:r.name,phone:r.phone||"",dob:r.dob||""});
    return;
  }
  const pid=await ensurePatient(r);
  if(r.allergy){
    await api("/table/allergy_records","POST",fitColumns("allergy_records",{
      patient_id:pid,allergen:r.allergy,recorded_on:today()
    })).catch(()=>{});
  }
  await api("/table/healthcare_records","POST",fitColumns("healthcare_records",{
    patient_id:pid,symptoms:r.symptoms,queue_name:TAG+r.lang,check_in_time:nowIso()
  }));
  await refresh();
}

  if(!apiOn){appointments.unshift({id:"a"+Date.now(),patient:b.name,doctor:b.docName,when:b.date+" "+b.time,reason:b.reason,status:"Scheduled"});return;}
  const pid=await ensurePatient({name:b.name,dob:form.age,phone:b.phone});
  if(tableSchemas.appointments){
    await api("/table/appointments","POST",fitColumns("appointments",{
      patient_id:pid,doctor_id:b.docId||undefined,appointment_date:b.date,appointment_time:b.time,
      scheduled_at:b.date+" "+b.time+":00",reason:b.reason,notes:b.reason,status:"Scheduled"
    }));

      patient_id:pid,symptoms:b.reason,queue_name:APPT_TAG+(b.docName||"Clinic"),check_in_time:b.date+" "+b.time+":00"
    }));

  await refresh();
}

async function patch(id,p){
  const c=cases.find(x=>x.id===id);
  if(!apiOn){if(c)Object.assign(c,p);persist();return;}
  if(!c)return;
  if(p.status==="prescribed"){
    await api("/table/healthcare_records/"+id,"PUT",fitColumns("healthcare_records",{
      clinical_summary:p.dx,recommended_action:p.rx,completed_at:nowIso()
    }));
    if(p.dx)await api("/table/diagnosis","POST",fitColumns("diagnosis",{patient_id:c.pid,doctor_id:docId||undefined,diagnosis_description:p.dx.slice(0,250),diagnosis_date:today()})).catch(()=>{});
    if(p.rx)await api("/table/prescription","POST",fitColumns("prescription",{patient_id:c.pid,doctor_id:docId||undefined,medicine_name:p.rx.slice(0,100),notes:TAG+id,issued_on:today()})).catch(()=>{});
  }else if(p.claim&&!c.claim){
    await api("/table/insurance_claims","POST",fitColumns("insurance_claims",{
      patient_id:c.pid,reference_number:p.claim.ins,claim_amount:Number(p.claim.amt)||0,claim_status:st.sub,submitted_on:today(),notes:TAG+id
    }));
  }else if(p.claim){
    const ok=p.claim.status==="approved";

}

/* ---- shared voice-to-text + real patient audio recorder ---- */
async function toggleMic(targetId){
  if(activeMicTarget===targetId){stopMic();return;}
  stopMic();
  if(!SR){toast(t().nosr);return;}
  const targetEl=$(targetId);if(!targetEl)return;

  if(targetId==="f-sym"&&navigator.mediaDevices&&window.MediaRecorder){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      audioChunks=[];
      mediaRec=new MediaRecorder(stream);
      mediaRec.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
      mediaRec.onstop=()=>{
        stream.getTracks().forEach(tr=>tr.stop());
        if(audioChunks.length){
          const blob=new Blob(audioChunks,{type:"audio/webm"});
          const reader=new FileReader();
          reader.onloadend=()=>{lastAudioUrl=reader.result;};
          reader.readAsDataURL(blob);
        }
      };
      mediaRec.start();
    }catch(_){}
  }

  rec=new SR();rec.lang=t().code;rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){
      const el=$(targetId);if(!el)continue;
      el.value=(el.value?el.value.trimEnd()+" ":"")+e.results[i][0].transcript.trim();
      if(targetId==="f-sym")form.sym=el.value;
    }
  };
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){stopMic();toast(t().nosr);}};
  rec.onend=()=>{if(activeMicTarget===targetId){try{rec.start();}catch(_){}}};
  try{rec.start();activeMicTarget=targetId;}catch(_){toast(t().nosr);return;}
  document.querySelectorAll(`[data-mic="${targetId}"]`).forEach(b=>b.classList.add("on"));
  if(targetId==="f-sym"&&$("mst"))$("mst").textContent=t().stop;
}
function stopMic(){
  activeMicTarget=null;
  if(rec){try{rec.stop();}catch(_){}}
  if(mediaRec&&mediaRec.state!=="inactive"){try{mediaRec.stop();}catch(_){}}
  document.querySelectorAll("[data-mic]").forEach(b=>b.classList.remove("on"));
  if($("mst"))$("mst").textContent=t().mic;
}

/* ---- patient: visits + claims ---- */
function vVisits(){
  const T=t();
  const mine=apiOn
    ?cases.filter(c=>c.pid===me())
    :(me0&&me0.name?cases.filter(c=>String(c.name||"").toLowerCase()===me0.name):cases);
  return loginCard()+(!mine.length?`<p class="k">${T.empty}</p>`:mine.map(c=>`<div class="card"><div class="meta"><span class="k">${when(c.ts)} · ${String(c.lang).toUpperCase()}</span>${chip(c)}</div>
  <p style="margin:0 0 6px">${esc(c.symptoms)}</p>
  ${c.status==="prescribed"?`<div class="k">${T.dx}</div><p style="margin:0 0 6px">${esc(c.dx)}</p><div class="k">${T.rx}</div><p style="margin:0 0 8px">${esc(c.rx)}</p>`:""}
  ${c.claim?`<div class="meta"><span class="k">${T.claim}: ${esc(c.claim.ins)} · ${esc(c.claim.amt)}</span>${cchip(c.claim.status)}</div>`
  :c.status==="prescribed"?`<div class="row"><input id="ci-${c.id}" placeholder="${T.ins}"><input id="ca-${c.id}" inputmode="decimal" placeholder="${T.amt}"></div>
  <button class="btn pri full" style="margin-top:8px" data-claim="${c.id}">${T.sendclaim}</button>`:""}</div>`).join(""));
}

/* ---- doctor ---- */
function speak(txt,code){
  if(!window.speechSynthesis){toast(t().nosyn);return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=L[code]?L[code].code:code;
  const ok=speechSynthesis.getVoices().some(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase()));
  if(speechSynthesis.getVoices().length&&!ok)toast(t().nosyn);
  speechSynthesis.speak(u);
}
function vCases(){const T=t();
  if(!cases.length)return docSel()+`<p class="k">${T.empty}</p>`;
  return docSel()+cases.map(c=>`<div class="card"><div class="meta"><b>${esc(c.name)} <span class="k">${ageOf(c.dob)}</span></b>${chip(c)}</div>
  <div class="k">${when(c.ts)} · ${String(c.lang).toUpperCase()} · ${esc(c.phone)} · ${T.allergy}: ${esc(c.allergy||"-")}</div>
  <p>${esc(c.symptoms)}</p>
  <button class="btn sm" data-listen="${c.id}">🔊 ${T.listen}</button>
  ${c.status==="prescribed"?`<p class="k" style="margin-top:10px">${T.dx}: ${esc(c.dx)}<br>${T.rx}: ${esc(c.rx)}</p>`:
  `<div class="meta" style="margin:10px 0 4px"><label for="dx-${c.id}" style="margin:0">${T.dx}</label>
     <button type="button" class="mic sm ${activeMicTarget===`dx-${c.id}`?"on":""}" data-mic="dx-${c.id}" aria-label="${T.dictate}">${MIC}</button></div>
   <textarea id="dx-${c.id}" style="min-height:60px"></textarea>
   <div class="meta" style="margin:10px 0 4px"><label for="rx-${c.id}" style="margin:0">${T.rx}</label>
     <button type="button" class="mic sm ${activeMicTarget===`rx-${c.id}`?"on":""}" data-mic="rx-${c.id}" aria-label="${T.dictate}">${MIC}</button></div>
   <textarea id="rx-${c.id}" style="min-height:60px"></textarea>
   <button class="btn pri full" style="margin-top:8px" data-reply="${c.id}">${T.reply}</button>`}</div>`).join("");
}
function vClaims(){const T=t(),list=cases.filter(c=>c.claim);
  if(!list.length)return`<p class="k">${T.empty}</p>`;
  return list.map(c=>`<div class="card"><div class="meta"><b>${esc(c.name)}</b>${cchip(c.claim.status)}</div>
  <div class="k">${T.ins}: ${esc(c.claim.ins)} · ${T.amt}: ${esc(c.claim.amt)}</div><p>${esc(c.rx)}</p>
  ${c.claim.status==="submitted"?`<div class="row"><button class="btn pri" data-cl="${c.id}:approved">${T.approve}</button><button class="btn bad" data-cl="${c.id}:rejected">${T.reject}</button></div>`:""}</div>`).join("");
}

/* ---- clinic dashboard ---- */
function vDash(){
  const T=t();
  const docList=getDoctors();
  const waiting=cases.filter(c=>c.status!=="prescribed").length;
  const openClaims=cases.filter(c=>c.claim&&c.claim.status==="submitted").length;
  const ratings=feedbacks.map(f=>Number(f.rating||f.score||0)).filter(n=>n>0);
  const avgFb=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1)+" ★":"–";

  const patientMap={};
  cases.forEach(c=>{if(!patientMap[c.name])patientMap[c.name]=c;});
  const patientList=Object.values(patientMap);

  return `<div class="kpis">
    <div class="kpi"><b>${stats.patients||patientList.length}</b><span class="k">${T.kpat}</span></div>
    <div class="kpi"><b>${stats.doctors||docList.length}</b><span class="k">${T.kdoc}</span></div>
    <div class="kpi"><b>${waiting}</b><span class="k">${T.kwait}</span></div>
    <div class="kpi"><b>${openClaims} · ${avgFb}</b><span class="k">${T.kclm} / ${T.kfb}</span></div>
  </div>

  <h3 style="margin:12px 0 6px">${T.kdoc} (${docList.length})</h3>
  ${docList.map(d=>`<div class="card" style="padding:10px 14px;margin-bottom:8px">
    <div class="meta" style="margin:0"><b>🩺 ${esc(d.name)}</b><span class="chip">ID #${esc(d.doctor_id)}</span></div>
  </div>`).join("")}

  <h3 style="margin:12px 0 6px">${T.kpat} (${patientList.length})</h3>
  ${!patientList.length?`<p class="k">${T.empty}</p>`:patientList.map(p=>`<div class="card" style="padding:10px 14px;margin-bottom:8px">
    <div class="meta"><b>${esc(p.name)}</b>${chip(p)}</div>
    <div class="k">${esc(p.phone||"-")} · ${T.allergy}: ${esc(p.allergy||"-")}</div>
    <p style="margin:4px 0 0;font-size:.9rem">${esc(p.symptoms)}</p>
  </div>`).join("")}

  <h3 style="margin:12px 0 6px">${T.allfb}</h3>`+
  (!feedbacks.length?`<p class="k">${T.empty}</p>`:feedbacks.map(f=>`<div class="card">
    <div class="meta"><b>${"★".repeat(Number(f.rating||f.score||5))}</b><span class="k">${esc(f.submitted_at||f.created_at||"")}</span></div>
    <p style="margin:0">${esc(f.comments||f.feedback_text||"")}</p></div>`).join(""));
}
function vAppts(){
  const T=t();
  if(!appointments.length)return`<p class="k">${T.empty}</p>`;
  return appointments.map(a=>`<div class="card"><div class="meta"><b>${esc(a.patient)} → ${esc(a.doctor)}</b><span class="chip ok">${esc(a.status)}</span></div>
    <div class="k">${esc(a.when)}</div><p style="margin:4px 0 0">${esc(a.reason)}</p></div>`).join("");
}

/* ---- events ---- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.l){stopMic();lang=b.dataset.l;view();}
  else if(b.dataset.r){stopMic();role=b.dataset.r;view();refresh().then(view);}
  else if(b.dataset.t){stopMic();tab=b.dataset.t;view();refresh().then(view);}
  else if(b.dataset.mic){toggleMic(b.dataset.mic);}
  else if(b.dataset.star){fbForm.rating=Number(b.dataset.star);view();}
  else if(b.id==="login-btn"){
    const q=$("login-q")?$("login-q").value:"";
    const found=await lookupPatient(q);
    if(found){toast(t().logged+" "+found.name);view();}else{toast(t().notfound);}
  }
  else if(b.id==="logout-btn"){saveSession(null);if(apiOn){cases=[];appointments=[];}view();}
  else if(b.dataset.listen){
    const c=cases.find(x=>x.id===b.dataset.listen);
    if(c&&c.audio){new Audio(c.audio).play();}
    else if(c){speak(c.symptoms,c.lang);}
  }
  else if(b.dataset.reply){stopMic();const id=b.dataset.reply,dx=$("dx-"+id).value.trim(),rx=$("rx-"+id).value.trim();
    if(!dx&&!rx)return;try{await patch(id,{status:"prescribed",dx,rx,by:me()});toast(t().saved);}catch(x){toast("DB: "+(x.message||x.code));}view();}
  else if(b.dataset.claim){const id=b.dataset.claim,ins=$("ci-"+id).value.trim(),amt=$("ca-"+id).value.trim();
    if(!ins||!amt)return;try{await patch(id,{claim:{ins,amt,status:"submitted"}});toast(t().saved);}catch(x){toast("DB: "+(x.message||x.code));}view();}
  else if(b.dataset.cl){const [id,s]=b.dataset.cl.split(":"),c=cases.find(x=>x.id===id);
    try{await patch(id,{claim:{...c.claim,status:s}});}catch(x){toast("DB: "+(x.message||x.code));}view();}
});

view();connectApi();
