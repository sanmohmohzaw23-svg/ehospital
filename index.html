.ic{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:1.4rem;margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}
.art{background:var(--soft);border-radius:28px;min-height:240px;display:grid;place-items:center;font-size:5rem}

claim:"ကုန်ကျစရိတ် တောင်းခံရန်",ins:"အာမခံ အမှတ်",amt:"ပမာဏ",sendclaim:"တောင်းခံမှု ပို့ရန်",csub:"တောင်းခံမှု ပို့ပြီး",capp:"အတည်ပြုပြီး",crej:"ပယ်ချခဲ့သည်",approve:"အတည်ပြုရန်",reject:"ပယ်ချရန်",
empty:"ယခုတွင် ဘာမှမရှိသေးပါ",need:"အမည်နှင့် ရောဂါလက္ခဏာကို အရင်ထည့်ပါ။",nosr:"ဤဘရောက်ဇာတွင် အသံမှတ်သားခြင်း မပါပါ။ စာရိုက်ပါ။",nosyn:"ဤဘာသာစကားအတွက် နားထောင်ခြင်း ဤစက်တွင် မရနိုင်ပါ။",demo:"နမူနာ",
disc:"စိတ်ကူးယဉ်ဒေတာဖြင့် နမူနာဖြစ်သည်။ လူနာအစစ်အမှန်၏ အချက်အလက်များကို မထည့်ပါနှင့်။",dbok:"ဒေတာဘေ့စ်နှင့် ချိတ်ဆက်ပြီး",dbno:"ဤစက်ထဲတွင် သိမ်းထားသည် (နမူနာသိမ်းဆည်းမှု)",
smp:"နှစ်ရက်ကတည်းက ဖျားပြီး လည်ချောင်းနာနေပါတယ်။",saved:"သိမ်းပြီး"}
};
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang="en",role="p",tab="speak",openId=null,listening=false,rec=null,db=null,uid=null,cases=[];
const KEY="ehospital_cases_v1";
try{cases=JSON.parse(localStorage.getItem(KEY)||"[]");}catch(_){cases=[];}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(cases.slice(0,200)));}catch(_){}}
const form={name:"",age:"",phone:"",allergy:"",sym:""};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,t=()=>L[lang];
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
let tt;function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),3200);}
const me=()=>uid||"local";

/* ---- data layer: database if available, memory otherwise ---- */
async function addCase(r){if(db){await db.collection("cases").add(r);}else{r.id="l"+Date.now();cases.unshift(r);persist();}}
async function patch(id,p){if(db){await db.collection("cases").doc(id).update(p);}else{const c=cases.find(x=>x.id===id);if(c)Object.assign(c,p);persist();}}

/* ---- chrome ---- */
function chrome(){
  const T=t();document.documentElement.lang=lang;
  $("disc").textContent=T.disc;
  $("role").children[0].textContent=T.rp;$("role").children[1].textContent=T.rd;
  [...$("role").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===role));
  $("langs").innerHTML=Object.keys(L).map(k=>`<button data-l="${k}" aria-pressed="${k===lang}">${L[k].n}</button>`).join("");
  const d=$("dbs");d.classList.toggle("ok",true);d.lastChild.textContent=db?T.dbok:T.dbno;
  const tabs=role==="p"?[["speak",T.tspeak],["visits",T.tvisits]]:[["cases",T.tcases],["claims",T.tclaims]];
  if(!tabs.some(x=>x[0]===tab))tab=tabs[0][0];
  $("nav").innerHTML=tabs.map(([k,l])=>`<button data-t="${k}" ${k===tab?'aria-current="true"':""}>${l}</button>`).join("");
}
function view(){chrome();const v=$("view");
  v.innerHTML=tab==="speak"?vSpeak():tab==="visits"?vVisits():tab==="cases"?vCases():vClaims();
  if(tab==="speak")bindSpeak();}
const chip=(c)=>{const T=t();
  if(c.status==="prescribed")return`<span class="chip ok">${T.done}</span>`;return`<span class="chip">${T.wait}</span>`;};
const cchip=(s)=>{const T=t();return s==="approved"?`<span class="chip ok">${T.capp}</span>`:s==="rejected"?`<span class="chip bad">${T.crej}</span>`:`<span class="chip">${T.csub}</span>`;};
const when=ts=>new Date(ts).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});

/* ---- patient: speak ---- */
function vSpeak(){const T=t();
  return `<div class="card">
  <label for="f-name">${T.name}</label><input id="f-name" value="${esc(form.name)}" autocomplete="off">
  <div class="row"><div><label for="f-age">${T.age}</label><input id="f-age" inputmode="numeric" value="${esc(form.age)}"></div>
  <div><label for="f-phone">${T.phone}</label><input id="f-phone" inputmode="tel" value="${esc(form.phone)}"></div></div>
  <label for="f-allergy">${T.allergy}</label><input id="f-allergy" value="${esc(form.allergy)}">
  <label for="f-sym">${T.sym}</label><textarea id="f-sym" lang="${lang}">${esc(form.sym)}</textarea>
  <div class="micwrap"><button class="mic ${listening?"on":""}" id="mic" aria-label="${T.mic}">${MIC}</button>
  <div><div id="mst">${listening?T.stop:T.mic}</div><button class="btn" id="smp" style="margin-top:6px;padding:4px 10px">${T.demo}</button></div></div>
  <button class="btn pri full" id="send">${T.submit}</button></div>`;
}
function bindSpeak(){
  ["name","age","phone","allergy","sym"].forEach(k=>$("f-"+k).addEventListener("input",e=>form[k]=e.target.value));
  $("mic").onclick=toggleMic;
  $("smp").onclick=()=>{form.sym=t().smp;$("f-sym").value=form.sym;};
  $("send").onclick=async()=>{
    if(!form.name.trim()||!form.sym.trim()){toast(t().need);return;}
    stopMic();
    try{await addCase({pid:me(),name:form.name.trim(),age:form.age,phone:form.phone,allergy:form.allergy,symptoms:form.sym.trim(),lang,ts:Date.now(),status:"waiting",dx:"",rx:"",claim:null});}
    catch(e){toast("DB: "+(e.message||e.code));return;}
    form.sym="";toast(t().sent);tab="visits";view();
  };
}
function toggleMic(){
  if(listening){stopMic();return;}
  if(!SR){toast(t().nosr);return;}
  rec=new SR();rec.lang=t().code;rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){
    form.sym=(form.sym?form.sym.trimEnd()+" ":"")+e.results[i][0].transcript.trim();const f=$("f-sym");if(f)f.value=form.sym;}};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){stopMic();toast(t().nosr);}};
  rec.onend=()=>{if(listening){try{rec.start();}catch(_){}}};
  try{rec.start();listening=true;}catch(_){toast(t().nosr);return;}
  $("mic").classList.add("on");$("mst").textContent=t().stop;
}
function stopMic(){listening=false;if(rec){try{rec.stop();}catch(_){}}const m=$("mic");if(m){m.classList.remove("on");$("mst").textContent=t().mic;}}

/* ---- patient: visits + claims ---- */
function vVisits(){const T=t(),mine=cases.filter(c=>c.pid===me());
  if(!mine.length)return`<p class="k">${T.empty}</p>`;
  return mine.map(c=>`<div class="card"><div class="meta"><span class="k">${when(c.ts)} · ${String(c.lang).toUpperCase()}</span>${chip(c)}</div>
  <p style="margin:0 0 6px">${esc(c.symptoms)}</p>
  ${c.status==="prescribed"?`<div class="k">${T.dx}</div><p style="margin:0 0 6px">${esc(c.dx)}</p><div class="k">${T.rx}</div><p style="margin:0 0 8px">${esc(c.rx)}</p>`:""}
  ${c.claim?`<div class="meta"><span class="k">${T.claim}: ${esc(c.claim.ins)} · ${esc(c.claim.amt)}</span>${cchip(c.claim.status)}</div>`
  :c.status==="prescribed"?`<div class="row"><input id="ci-${c.id}" placeholder="${T.ins}"><input id="ca-${c.id}" inputmode="decimal" placeholder="${T.amt}"></div>
  <button class="btn pri full" style="margin-top:8px" data-claim="${c.id}">${T.sendclaim}</button>`:""}</div>`).join("");
}

/* ---- doctor ---- */
function speak(txt,code){
  if(!window.speechSynthesis){toast(t().nosyn);return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=L[code]?L[code].code:code;
  const ok=speechSynthesis.getVoices().some(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase()));
  if(speechSynthesis.getVoices().length&&!ok)toast(t().nosyn);
  speechSynthesis.speak(u);
}
function vCases(){const T=t();
  if(!cases.length)return`<p class="k">${T.empty}</p>`;
  return cases.map(c=>`<div class="card"><div class="meta"><b>${esc(c.name)} <span class="k">${esc(c.age)}</span></b>${chip(c)}</div>
  <div class="k">${when(c.ts)} · ${String(c.lang).toUpperCase()} · ${esc(c.phone)} · ${T.allergy}: ${esc(c.allergy||"-")}</div>
  <p>${esc(c.symptoms)}</p>
  <button class="btn" data-listen="${c.id}">🔊 ${T.listen}</button>
  ${c.status==="prescribed"?`<p class="k" style="margin-top:10px">${T.dx}: ${esc(c.dx)}<br>${T.rx}: ${esc(c.rx)}</p>`:
  `<label for="dx-${c.id}">${T.dx}</label><textarea id="dx-${c.id}" style="min-height:64px"></textarea>
   <label for="rx-${c.id}">${T.rx}</label><textarea id="rx-${c.id}" style="min-height:64px"></textarea>
   <button class="btn pri full" style="margin-top:8px" data-reply="${c.id}">${T.reply}</button>`}</div>`).join("");
}
function vClaims(){const T=t(),list=cases.filter(c=>c.claim);
  if(!list.length)return`<p class="k">${T.empty}</p>`;
  return list.map(c=>`<div class="card"><div class="meta"><b>${esc(c.name)}</b>${cchip(c.claim.status)}</div>
  <div class="k">${T.ins}: ${esc(c.claim.ins)} · ${T.amt}: ${esc(c.claim.amt)}</div><p>${esc(c.rx)}</p>
  ${c.claim.status==="submitted"?`<div class="row"><button class="btn pri" data-cl="${c.id}:approved">${T.approve}</button><button class="btn bad" data-cl="${c.id}:rejected">${T.reject}</button></div>`:""}</div>`).join("");
}

/* ---- events ---- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.l){stopMic();lang=b.dataset.l;view();}
  else if(b.dataset.r){stopMic();role=b.dataset.r;view();}
  else if(b.dataset.t){stopMic();tab=b.dataset.t;view();}
  else if(b.dataset.listen){const c=cases.find(x=>x.id===b.dataset.listen);if(c)speak(c.symptoms,c.lang);}
  else if(b.dataset.reply){const id=b.dataset.reply,dx=$("dx-"+id).value.trim(),rx=$("rx-"+id).value.trim();
    if(!dx&&!rx)return;try{await patch(id,{status:"prescribed",dx,rx,by:me()});toast(t().saved);}catch(x){toast("DB: "+(x.message||x.code));}view();}
  else if(b.dataset.claim){const id=b.dataset.claim,ins=$("ci-"+id).value.trim(),amt=$("ca-"+id).value.trim();
    if(!ins||!amt)return;try{await patch(id,{claim:{ins,amt,status:"submitted"}});toast(t().saved);}catch(x){toast("DB: "+(x.message||x.code));}view();}
  else if(b.dataset.cl){const [id,s]=b.dataset.cl.split(":"),c=cases.find(x=>x.id===id);
    try{await patch(id,{claim:{...c.claim,status:s}});}catch(x){toast("DB: "+(x.message||x.code));}view();}
});

/* ---- connect database (resolves after load) ---- */
async function connect(){
  if(!window.claude||!claude.use)return;
  try{const u=await claude.use("user");if(u&&u.id)uid=await u.id();}catch(_){}
  try{db=await claude.use("db");}catch(_){}
  if(!db){view();return;}
  cases=[];
  db.collection("cases").orderBy("ts","desc").limit(100).onSnapshot(s=>{
    cases=s.docs.map(d=>({id:d.id,...d.data()}));
    const a=document.activeElement;if(a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT"))return; /* don't wipe typing */
    view();},()=>{});
  view();
}
view();
<\/script>
